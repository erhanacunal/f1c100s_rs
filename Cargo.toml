[package]
name = "f1c100s"
version = "0.1.0"
edition = "2021"
description = "Rust hardware abstraction library for Allwinner F1C100s (ARM926EJ-S)"
license = "MIT OR Apache-2.0"

[dependencies]
log = { version = "0.4", default-features = false }

[build-dependencies]

[features]
default = []

# Hardware examples (flash with tools/flash.ps1 -Example <name>)
[[example]]
name = "dma_demo"
path = "docs/examples/dma_demo.rs"

[[example]]
name = "spi_dma_demo"
path = "docs/examples/spi_dma_demo.rs"

[[example]]
name = "fbdma_demo"
path = "docs/examples/fbdma_demo.rs"

[[example]]
name = "fbdma_panel_demo"
path = "docs/examples/fbdma_panel_demo.rs"
